name: Model tests

# Renders the edge cases of the OpenSCAD model and the ready-made builds of the configurator
# (scripts/test_models.py): no errors, no unexpected warnings, non-empty parts, a coherent bill of materials.
on:
  push:
    branches: [main]
    paths: [src/**, scripts/test_models.py, web/src/main.js, .github/workflows/models.yml]
  pull_request:
    paths: [src/**, scripts/test_models.py, web/src/main.js, .github/workflows/models.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq openscad
      - run: openscad --version
      - run: python3 scripts/test_models.py -j 4
