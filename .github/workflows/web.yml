name: Web tests

# The web generator in a real browser (Playwright, Chromium): the built site, its Spanish and share pages, the editor
# with real OpenSCAD renders, the piece view, undo, short links and a full kit download.
on:
  push:
    branches: [main]
    paths: [web/**, src/**, stl/**, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, src/**, stl/**, .github/workflows/web.yml]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
