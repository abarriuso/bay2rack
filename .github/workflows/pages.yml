name: Redirect to the web generator (GitHub Pages)

# The web generator lives on Cloudflare Pages (https://bay2rack.pages.dev/, built from web/ on every push).
# The old GitHub Pages address only sends visitors there, keeping the #anchor (e.g. #build).
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>bay2rack</title>
          <link rel="canonical" href="https://bay2rack.pages.dev/">
          <meta http-equiv="refresh" content="0; url=https://bay2rack.pages.dev/">
          <script>location.replace('https://bay2rack.pages.dev/' + location.hash)</script>
          <p>bay2rack has moved to <a href="https://bay2rack.pages.dev/">bay2rack.pages.dev</a>.</p>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
