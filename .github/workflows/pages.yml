name: Web generator mirror (GitHub Pages)

# The web generator lives on Cloudflare Pages (https://bay2rack.pages.dev/, built from web/ on every push).
# This builds the same site on GitHub Pages (https://abarriuso.github.io/bay2rack/): a mirror for when the
# Cloudflare address cannot be reached (Spanish ISPs block Cloudflare IP ranges during football matches).
on:
  push:
    branches: [main]
    paths: [web/**, src/**, stl/**, docs/img/**, docs/gallery/**, docs/video/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
