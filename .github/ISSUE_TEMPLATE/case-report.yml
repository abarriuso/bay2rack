name: Case report
description: Tell us how bay2rack fits in your PC case (it fits, it needs a tweak, it doesn't fit)
title: "Case: <brand and model>"
labels: [case-report]
body:
  - type: markdown
    attributes:
      value: |
        Every report goes into the [compatibility list](https://github.com/abarriuso/bay2rack/blob/main/docs/CASES.md). Thanks!
        Print the bay test piece first if you can: it tells most of the story in 20 minutes.
  - type: input
    id: case
    attributes:
      label: Case brand and model
      placeholder: e.g. Antec Three Hundred
    validations:
      required: true
  - type: input
    id: bays
    attributes:
      label: How many 5.25" bays does it have, and how many did you use?
      placeholder: e.g. 3 bays, adapter for 2
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It fits as it is
        - It fits after changing parameters (say which below)
        - It doesn't fit
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: What did you print?
      description: A file from stl/, a configurator link (Copy link button) or the settings you changed.
      placeholder: e.g. stl/plate-flush/3bay-2U/adapter.stl
  - type: dropdown
    id: tabs
    attributes:
      label: Metal tabs between the bays
      options:
        - The case has them and the grooves clear them
        - The case has them and I had to bend them
        - The case has none
        - Not sure
  - type: textarea
    id: measures
    attributes:
      label: Measurements and changes
      description: Anything that differs from the defaults (bay screw holes, bay width, how far the plastic front stands out...).
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Drag photos here, from the front and from inside if you can.
  - type: input
    id: material
    attributes:
      label: Printer and material
      placeholder: e.g. Bambu A1, PETG, 0.2 mm
