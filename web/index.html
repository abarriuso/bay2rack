<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bay2rack · old PC case → 6" homelab rack</title>
  <meta name="description" content="Turn the 5.25 inch bays of an old PC case into a 6 inch mini rack for a cheap homelab. Configure it, see it mounted in 3D and download every STL in your browser.">
  <meta property="og:title" content="bay2rack · old PC case → 6&quot; homelab rack">
  <meta property="og:image" content="img/hero.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='5' fill='%23ef7d32'/%3E%3Crect x='7' y='9' width='18' height='5' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='17' width='18' height='5' rx='1.5' fill='%23fff' opacity='.7'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <span id="logo" class="logo"></span>
      <span class="titles"><strong>bay2rack</strong><span data-i18n="subtitle"></span></span>
    </a>
    <nav>
      <button id="theme" class="icon-btn" type="button" data-i18n-tip="theme" aria-label="theme"></button>
      <button id="lang" class="pill" type="button">ES</button>
      <a class="pill" href="https://github.com/abarriuso/bay2rack" data-i18n="source"></a>
    </nav>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2 class="panel-title" data-i18n="steps"></h2>
      <div id="steps"></div>
      <label class="toggle advanced">
        <input type="checkbox" id="advanced"><span class="track"></span>
        <span><b data-i18n="advanced"></b> <small data-i18n="advancedHint"></small></span>
      </label>
      <div id="form" class="advanced-form" hidden></div>
    </aside>

    <main class="stage">
      <div class="viewer">
        <div id="tabs" class="tabs"></div>
        <div id="view" class="view"></div>
        <div class="floatbar">
          <span id="status" class="status"></span>
          <span class="spacer"></span>
          <button id="fit" class="pill" type="button" data-i18n="resetView"></button>
          <button id="share" class="pill" type="button" data-i18n="share"></button>
        </div>
      </div>
      <section class="results">
        <div class="downloads">
          <button id="kit" class="primary" type="button" data-i18n="downloadKit"></button>
          <label class="check"><input type="checkbox" id="withTests" checked><span data-i18n="withTests"></span></label>
          <button id="download" class="pill" type="button" disabled></button>
          <div id="prebuilt" class="prebuilt"></div>
        </div>
        <div class="cards-2">
          <div class="card"><h3 data-i18n="bom"></h3><ul id="bom" class="bom"></ul></div>
          <div class="card"><h3 data-i18n="warnings"></h3><ul id="warnings" class="warnings"></ul></div>
        </div>
        <details class="log"><summary data-i18n="log"></summary><pre id="log"></pre></details>
      </section>
    </main>
  </div>

  <footer>
    <span data-i18n="footer"></span>
    <a href="https://github.com/openscad/openscad">OpenSCAD</a> ·
    <a href="https://www.npmjs.com/package/@kreijstal/openscad-wasm">WebAssembly build</a> ·
    bay2rack CC BY-NC-SA 4.0
  </footer>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
